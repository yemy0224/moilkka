name: Supabase 잠들기 방지

# Supabase 무료 프로젝트는 일주일 동안 아무도 안 쓰면 잠들어요.
# 하루 한 번 가볍게 접속해서 깨워둬요. (한국 시간 오전 9시 무렵)
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS -X POST "https://sfvapctbkcvixijozrgy.supabase.co/rest/v1/rpc/seoul_today" \
            -H "apikey: sb_publishable_32XvZKnKOUCVl_caztquiA_PM-2qyDm" \
            -H "Content-Type: application/json" -d '{}'
